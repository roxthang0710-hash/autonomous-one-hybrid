<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Enna, bé cừu trợ lý AI trong căn phòng làm việc ấm áp</title><desc id="desc">Minh họa vector sắc nét: Enna chớp mắt, gõ bàn phím; tách cà phê tỏa khói và cây xanh bên cửa sổ.</desc>
<style>
.s-bob{transform-origin:225px 360px;animation:bob 4s ease-in-out infinite}.s-eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}.paw{animation:type .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.paw.right{animation-delay:.24s}.steam{animation:steam 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.steam.two{animation-delay:1s}.spark{animation:shine 1.7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px) rotate(1deg)}}@keyframes blink{0%,46%,49%,100%{transform:scaleY(1)}47.5%{transform:scaleY(.08)}}@keyframes type{to{transform:translateY(11px) rotate(5deg)}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.75}100%{opacity:0;transform:translateY(-24px)}}@keyframes shine{50%{opacity:.25;transform:scale(.8)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fdf5e8"/><stop offset="1" stop-color="#ecdfc6"/></linearGradient>
