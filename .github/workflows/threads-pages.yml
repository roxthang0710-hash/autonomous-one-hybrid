name: Enna — Publish OAuth Control Portal
on:
  push:
    paths:
      - 'docs/**'
      - 'starter/enna-clone/**'
      - '.github/workflows/threads-pages.yml'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: autonomous-one-public-oauth-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'oauth-pages:'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure already-enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package publicly shareable Enna Clone Starter
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          source=Path('starter/enna-clone')
          target=Path('docs/enna/clone/enna-clone-starter.zip')
          allow={'agent.py','README.md'}
          files=list(source.iterdir())
          assert {p.name for p in files if p.is_file() and p.name in allow}==allow
          with ZipFile(target,'w',compression=ZIP_DEFLATED) as archive:
            for p in sorted(files):
              if p.name in allow and p.is_file():
                archive.write(p,arcname='enna-clone-starter/'+p.name)
          with ZipFile(target) as archive:
            assert set(archive.namelist())=={
              'enna-clone-starter/agent.py',
              'enna-clone-starter/README.md'}
            assert all('secret' not in x.lower() and '.env' not in x.lower()
                       for x in archive.namelist())
          print('Packaged safe starter only:',target.stat().st_size,'bytes')
          PY
      - name: Upload static portal without credentials
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
