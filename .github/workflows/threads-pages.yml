name: Enna — Publish OAuth Control Portal
on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/threads-pages.yml'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: autonomous-one-public-oauth-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'oauth-pages:'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure already-enabled GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static portal without credentials
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
