name: Enna — Affiliate Research
on:
  schedule:
    # UTC+7 Vietnam: Tue and Fri at 09:30 local (best effort).
    - cron: '30 2 * * 2,5'
  workflow_dispatch:
    inputs:
      niche:
        description: "Optional organic affiliate research niche"
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: autonomous-one-affiliate-research
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'affiliate:'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      AFFILIATE_TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      AFFILIATE_NICHE: ${{ github.event_name == 'issues' && github.event.issue.title || github.event.inputs.niche || '' }}
      MAX_AFFILIATE_RUNS_PER_WEEK: '3'
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$DB_SERVICE_KEY" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Missing required cloud secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (no live API calls)
        run: python -m unittest discover -s tests -v
      - name: Research and store one affiliate draft
        run: python -m affiliate.runner
      - name: Summarize commercial-readiness evidence (no publishing)
        if: always()
        run: python -m growth.monetization
      - name: Rank verified affiliate product hypotheses (read only)
        run: python -m growth.affiliate_selection
      - name: Log confirmed monetization readiness check
        run: python -m growth.activity_log system success monetization_checked
      - name: Enna next-best-action report (read only, evidence-first)
        if: always()
        run: python -m enna
      - name: Summarize results without publishing private ideas
        if: always()
        run: |
          echo "## Affiliate research" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: see job logs and the private Supabase affiliate_opportunities table." >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: organic draft only; no purchases, posting or tracking links." >> "$GITHUB_STEP_SUMMARY"
