name: Enna — Automated Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dashboard/web/app.js
      - run: node --test tests/test_calendar.cjs

      - run: node --check dashboard/web/studio.js
      - run: node --test tests/test_observatory.cjs
      - run: node --test tests/test_enna_dashboard_ui.cjs
      - run: node --test tests/test_office_kit.cjs
      - run: node --test tests/test_enna_link_hub.cjs
      - run: node --check docs/enna/desk.js
      - run: node --test tests/test_enna_desk_web.cjs
      - name: Verify deployed Agent Desk and owner-only API
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const page='https://gjdvdohylvsauphhkutw.supabase.co/functions/v1/enna-site/';
          const endpoint='https://gjdvdohylvsauphhkutw.supabase.co/functions/v1/enna-desk';
          (async()=>{
            let html='';
            for(let i=0;i<3;i++){
              const res=await fetch(page,{signal:AbortSignal.timeout(12000),cache:'no-store'});
              if(res.status===200){html=await res.text();if(html.includes('id="task-form"'))break;}
              await new Promise(resolve=>setTimeout(resolve,1500));
            }
            assert.match(html,/id="task-form"/,'Live Enna Desk must render task form');
            assert.match(html,/id="research-form"/,'Live Enna Desk must expose research execution');
            assert.match(html,/id="sign-in-hero"/,'Owner connection button must be visible in live hero');
            assert.match(html,/KẾT NỐI ENNA BẰNG GITHUB/,'Live page must show explicit GitHub connection CTA');
            const scriptResponse=await fetch(page+'desk.js',{signal:AbortSignal.timeout(12000)});
            assert.equal(scriptResponse.status,200,'Live Enna Desk script must exist');
            const js=await scriptResponse.text();
            assert.match(js,/run_research/,'Live Enna Desk script must support research execution');
            assert.match(js,/sign-in-hero/,'Live JS must bind prominent GitHub connection button');
            assert.match(js,/signInWithOAuth/,'Live JS must initiate GitHub OAuth');
            const api=await fetch(endpoint,{signal:AbortSignal.timeout(12000)});
            assert.ok([401,403].includes(api.status),'Unauthenticated desk API must refuse access');
            console.log('Live Enna Desk accessible; private API blocked unauthenticated requests');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Verify GitHub Pages renders Enna as HTML
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const page='https://roxthang0710-hash.github.io/autonomous-one-hybrid/enna/desk.html';
          (async()=>{
            const r=await fetch(page,{signal:AbortSignal.timeout(18000),cache:'no-store'});
            const contentType=r.headers.get('content-type')||'';
            const html=await r.text();
            console.log('GitHub Pages status:',r.status,'Content-Type:',contentType);
            assert.equal(r.status,200,'Enna Pages must respond 200');
            assert.match(contentType,/text\/html/i,'Browser must render HTML, not raw text source');
            assert.match(html,/id="sign-in-hero"/,'Owner sign-in button must be visible');
            assert.match(html,/id="copy-profile-bio"/,'Published Enna Desk must show bio optimization action');
            const links=await fetch('https://roxthang0710-hash.github.io/autonomous-one-hybrid/enna/links/',{signal:AbortSignal.timeout(18000),cache:'no-store'});
            assert.equal(links.status,200,'Published link-in-bio must be accessible');
            assert.match(links.headers.get('content-type')||'',/text\/html/i);
            assert.match(await links.text(),/Theo dõi Đồ Hay Đi Làm trên Threads/,'Published link-in-bio must invite real follower growth');
            const js=await fetch(new URL('desk.js',page),{signal:AbortSignal.timeout(18000)});
            const scriptType=js.headers.get('content-type')||'';
            const body=await js.text();
            console.log('Enna Desk JS status:',js.status,'Content-Type:',scriptType);
            assert.equal(js.status,200,'Desk Javascript must be accessible');
            assert.match(scriptType,/javascript/i,'Javascript must be served with correct MIME type');
            assert.match(body,/sign-in-hero/,'Desk Javascript must wire owner sign-in');
            console.log('GitHub Pages Enna Desk HTML/CSS/JS deploy check passed');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Verify old Enna Desk URL redirects away from raw source
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const url='https://gjdvdohylvsauphhkutw.supabase.co/functions/v1/enna-site/';
            const r=await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(18000),cache:'no-store'});
            const target=r.headers.get('location')||'';
            console.log('Legacy Enna URL:',r.status,'redirect to:',target);
            assert.ok([301,302,303,307,308].includes(r.status),'Legacy URL must redirect, never show raw HTML');
            assert.equal(target,'https://roxthang0710-hash.github.io/autonomous-one-hybrid/enna/desk.html');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Check public Enna activity feed response
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const url='https://gjdvdohylvsauphhkutw.supabase.co/functions/v1/enna-public-status?mode=events';
          (async()=>{
            const response=await fetch(url,{signal:AbortSignal.timeout(12000)});
            assert.equal(response.status,200,'Safe public journal must be reachable');
            const data=await response.json();
            assert.ok(Array.isArray(data.activity),'Activity should be an array');
            assert.ok(data.activity.length > 0,
                      'Public journal must contain real operational entries');
            assert.ok(data.activity.every(e=>e.at && e.kind && e.status && e.code),
                      'Activity entries must be structured');
            const snapshot=await fetch(url.replace('?mode=events',''),{signal:AbortSignal.timeout(12000)});
            assert.equal(snapshot.status,200,'Full Enna dashboard feed must be reachable');
            const full=await snapshot.json();
            assert.ok(Array.isArray(full.activity),'Dashboard activity must be an array');
            assert.ok(Number.isInteger(full.posts.published),'Published count must be verifiable');
            assert.equal(typeof full.runtime.workerLastResult,'string','Worker heartbeat must be present');
            console.log('Enna public feeds online:',data.activity.length,'events;',
                        full.posts.published,'verified published posts');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
