name: Enna — Automated Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dashboard/web/app.js
      - run: node --test tests/test_calendar.cjs

      - run: node --check dashboard/web/studio.js
      - run: node --test tests/test_observatory.cjs
      - run: node --test tests/test_enna_dashboard_ui.cjs
      - run: node --test tests/test_office_kit.cjs
      - name: Check public Enna activity feed response
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const url='https://gjdvdohylvsauphhkutw.supabase.co/functions/v1/enna-public-status?mode=events';
          (async()=>{
            const response=await fetch(url,{signal:AbortSignal.timeout(12000)});
            assert.equal(response.status,200,'Safe public journal must be reachable');
            const data=await response.json();
            assert.ok(Array.isArray(data.activity),'Activity should be an array');
            assert.ok(data.activity.some(e=>e.code==='ops_completed'),
                      'Journal must include a verified automatic-operations smoke test');
            assert.ok(data.activity.every(e=>e.at && e.kind && e.status && e.code),
                      'Activity entries must be structured');
            const snapshot=await fetch(url.replace('?mode=events',''),{signal:AbortSignal.timeout(12000)});
            assert.equal(snapshot.status,200,'Full Enna dashboard feed must be reachable');
            const full=await snapshot.json();
            assert.ok(Array.isArray(full.activity),'Dashboard activity must be an array');
            assert.ok(Number.isInteger(full.posts.published),'Published count must be verifiable');
            assert.equal(typeof full.runtime.workerLastResult,'string','Worker heartbeat must be present');
            console.log('Enna public feeds online:',data.activity.length,'events;',
                        full.posts.published,'verified published posts');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
