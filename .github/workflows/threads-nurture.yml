name: Autonomous One — Threads Nurture
on:
  schedule:
    # 09:45 Vietnam time daily. GitHub cron is best effort.
    - cron: '45 2 * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      action:
        description: "plan = maintain drafts; publish = disabled while Metricool handles publishing"
        required: true
        type: choice
        options: [plan, publish]
        default: plan

permissions:
  contents: read

concurrency:
  group: autonomous-one-threads-nurture
  cancel-in-progress: false

jobs:
  nurture:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'threads:'))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_EXPECTED_USERNAME: ${{ secrets.THREADS_EXPECTED_USERNAME }}
      THREADS_PUBLISH_ENABLED: ${{ secrets.THREADS_PUBLISH_ENABLED }}
      THREADS_FORCE_GENERATION: "${{ github.event_name == 'issues' && startsWith(github.event.issue.title, 'threads: ai') && 'true' || 'false' }}"
    steps:
      - name: Require backend configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$DB_SERVICE_KEY" ]; then
            echo "Missing Supabase backend secrets" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Test before any publishing action
        run: python -m unittest discover -s tests -v
      - name: Generate and maintain editorial calendar
        if: github.event_name == 'schedule' || github.event_name == 'issues' || github.event.inputs.action == 'plan'
        run: python -m threads.content
      - name: Private-safe report
        if: always()
        run: |
          echo "## Threads nurture" >> "$GITHUB_STEP_SUMMARY"
          echo "14-day editorial calendar and guarded official Meta API integration." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing is managed by Metricool; Github only drafts and never publishes directly." >> "$GITHUB_STEP_SUMMARY"
          echo "No affiliate links, purchases, group spam or fabricated testimonials." >> "$GITHUB_STEP_SUMMARY"
