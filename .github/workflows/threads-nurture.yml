name: Enna — Threads Content & Publishing
on:
  schedule:
    # 09:45, 12:45, 18:45 Vietnam time: second/third cycles are
    # catch-up checks after delayed Actions runs. SQL post-claim prevents
    # duplicate publishing; ambiguous writes are never auto-retried.
    - cron: '45 2,5,11 * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      action:
        description: "plan = only create drafts; publish = run guarded Meta worker if owner OAuth is connected"
        required: true
        type: choice
        options: [plan, publish]
        default: plan

permissions:
  contents: read

concurrency:
  group: autonomous-one-threads-nurture
  cancel-in-progress: false

jobs:
  nurture:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'threads:'))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      THREADS_INITIAL_SHORT_TOKEN: ${{ secrets.THREADS_INITIAL_SHORT_TOKEN }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
      THREADS_EXPECTED_USERNAME: ${{ secrets.THREADS_EXPECTED_USERNAME }}
      THREADS_PUBLISH_ENABLED: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan' && 'false' || secrets.THREADS_PUBLISH_ENABLED }}"
      THREADS_FORCE_GENERATION: "${{ github.event_name == 'issues' && startsWith(github.event.issue.title, 'threads: ai') && 'true' || 'false' }}"
    steps:
      - name: Require backend configuration
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$DB_SERVICE_KEY" ]; then
            echo "Missing Supabase backend secrets" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Test before any publishing action
        run: python -m unittest discover -s tests -v
      - name: Generate drafts, publish only after OAuth, and collect real insights
        run: python -m threads.daily
      - name: Check real conversations on own Threads posts (read only)
        if: always()
        run: python -m growth.own_conversations
      - name: Measure storytelling versus practical posts (read only)
        if: always()
        run: python -m growth.story_insights
      - name: Account cultivation and Shopee application readiness (read only)
        if: always()
        run: |
          python -m threads.readiness
      - name: Enna autonomous health and truthful performance check
        if: always()
        run: python -m enna
      - name: Private-safe report
        if: always()
        run: |
          echo "## Enna Threads Nurture — real provider outcomes only" >> "$GITHUB_STEP_SUMMARY"
          echo "Publisher uses owner-approved Meta OAuth stored encrypted in Supabase Vault; token refresh is automated." >> "$GITHUB_STEP_SUMMARY"
          echo "The account cultivation snapshot distinguishes scheduled posts from verified publications. Shopee Affiliate requires separate real approval; no eligibility or earnings are implied." >> "$GITHUB_STEP_SUMMARY"
          echo "Metricool now has 26 booked posts during the 7-day sprint; Enna only confirms publication after seeing actual Meta posts." >> "$GITHUB_STEP_SUMMARY"
          echo "No affiliate links, purchases, group spam or fabricated testimonials." >> "$GITHUB_STEP_SUMMARY"
