name: Enna — Read-Only Meta Reply Reconciliation

on:
  workflow_run:
    workflows: ['Enna — Owner-Selected Threads Reply']
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enna-meta-reply-readonly-reconcile
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
      THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
      THREADS_EXPECTED_USERNAME: ${{ secrets.THREADS_EXPECTED_USERNAME }}
      THREADS_AUTO_ENGAGE_ENABLED: ${{ secrets.THREADS_AUTO_ENGAGE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Verify no-write reconciliation policy
        run: python -m unittest discover -s tests -p 'test_companion_verify_uncertain.py' -v
      - name: Check actual replies via Meta owner GET only
        run: python -m growth.companion_verify_uncertain
      - name: Explain conservative verification
        if: always()
        run: |
          echo 'This workflow performs only the official GET /me and GET /me/replies reads.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A prior uncertain reply is considered published only if Meta returns an owner-authored reply whose direct parent ID and timestamp match the one-shot attempt.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A missing reply or denied read does not prove the reply was never posted. Writes to Threads are forbidden in this workflow.' >> "$GITHUB_STEP_SUMMARY"
