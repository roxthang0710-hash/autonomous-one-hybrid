name: Enna - Printify SKU contribution audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real Printify product cost vs selling price across each enabled variant
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: python integrations/printify/unit_economics.py
