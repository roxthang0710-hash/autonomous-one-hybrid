name: Autonomous One — Growth Radar
on:
  schedule:
    # 09:15 and 17:15 Vietnam time (UTC+7); best effort.
    - cron: '15 2,10 * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: autonomous-one-growth-radar
  cancel-in-progress: false

jobs:
  growth:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'growth:'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      THREADS_DISCOVERY_ENABLED: ${{ secrets.THREADS_DISCOVERY_ENABLED }}
      THREADS_DISCOVERY_ACCESS_TOKEN: ${{ secrets.THREADS_DISCOVERY_ACCESS_TOKEN }}
    steps:
      - name: Verify configured research credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$DB_SERVICE_KEY" ]; then
            echo "Growth Radar needs existing Supabase server keys." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests before trend analysis
        run: python -m unittest discover -s tests -v
      - name: Collect public trend evidence and draft one safe growth idea
        run: python -m growth.runner
      - name: Summarize monitoring without confidential drafts
        if: always()
        run: python -m growth.report
      - name: Public-repo-safe summary
        if: always()
        run: |
          echo "## Autonomous One Growth Radar" >> "$GITHUB_STEP_SUMMARY"
          echo "Public sources are Google Trends Vietnam RSS and narrowly filtered Google News RSS." >> "$GITHUB_STEP_SUMMARY"
          echo "Threads discussion search requires additional official Meta OAuth permissions." >> "$GITHUB_STEP_SUMMARY"
          echo "All drafts stay private in Supabase; no replies, reposts, comments or outreach are sent." >> "$GITHUB_STEP_SUMMARY"
          echo "The number of recommended content ideas is not a revenue forecast." >> "$GITHUB_STEP_SUMMARY"
