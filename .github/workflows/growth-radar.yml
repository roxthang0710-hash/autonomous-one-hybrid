name: Enna — Growth Radar & Conversations
on:
  schedule:
    # 09:15, 14:15, 19:15 Vietnam time (UTC+7); best effort.
    # These are opportunities to discover ONE useful discussion per run,
    # not a quota or permission to spam. DB caps replies at three/day.
    - cron: '15 2,7,12 * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: autonomous-one-growth-radar
  cancel-in-progress: false

jobs:
  growth:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'growth:'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      THREADS_DISCOVERY_ENABLED: ${{ secrets.THREADS_DISCOVERY_ENABLED }}
      THREADS_AUTO_ENGAGE_ENABLED: ${{ secrets.THREADS_AUTO_ENGAGE_ENABLED }}
      THREADS_EXPECTED_USERNAME: ${{ secrets.THREADS_EXPECTED_USERNAME }}
      THREADS_PUBLISH_ENABLED: ${{ secrets.THREADS_PUBLISH_ENABLED }}
      THREADS_TOKEN_KEY: ${{ secrets.THREADS_TOKEN_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ENNA_ORIGINAL_MEDIA_ENABLED: 'true'
    steps:
      - name: Verify configured research credentials
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$DB_SERVICE_KEY" ]; then
            echo "Growth Radar needs existing Supabase server keys." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests before trend analysis
        run: python -m unittest discover -s tests -v
      - name: Log verified worker start (private)
        run: python -m growth.activity_log growth started growth_started
      - name: Collect public trend evidence and draft one safe growth idea
        run: python -m growth.runner
      - name: Optional one authentic on-topic Threads reply (off until owner OAuth opt-in)
        run: python -m growth.engage
      - name: Care for genuine unanswered questions on our own Threads posts
        id: community
        run: python -m growth.community_care
      - name: Scout public-domain visuals, optional Pexels and create original office meme cards
        id: media
        run: python -m growth.media_scout
      - name: Record independent community and media checks
        if: always()
        env:
          COMMUNITY_OUTCOME: ${{ steps.community.outcome }}
          MEDIA_OUTCOME: ${{ steps.media.outcome }}
        run: |
          if [ "$COMMUNITY_OUTCOME" = "success" ]; then
            python -m growth.activity_log growth success community_checked
          elif [ "$COMMUNITY_OUTCOME" != "skipped" ]; then
            python -m growth.activity_log growth failed community_checked
          fi
          if [ "$MEDIA_OUTCOME" = "success" ]; then
            python -m growth.activity_log editor success media_checked
          elif [ "$MEDIA_OUTCOME" != "skipped" ]; then
            python -m growth.activity_log editor failed media_checked
          fi
      - name: Summarize monitoring without confidential drafts
        if: always()
        run: python -m growth.report
      - name: Enna operational health — no fake followers or earnings
        if: always()
        run: python -m enna
      - name: Public-repo-safe summary
        if: always()
        run: |
          echo "## Enna Growth Radar" >> "$GITHUB_STEP_SUMMARY"
          echo "Public sources are Google Trends Vietnam RSS and narrowly filtered Google News RSS." >> "$GITHUB_STEP_SUMMARY"
          echo "Threads external-public search may require Meta App Review even after user OAuth; Enna never bypasses unavailable permissions." >> "$GITHUB_STEP_SUMMARY"
          echo "Reply worker is gated by owner Meta OAuth scopes, app access, source checks and an atomic maximum of three authentic replies per Vietnam day; it may post zero." >> "$GITHUB_STEP_SUMMARY"
          echo "The number of recommended content ideas is not a revenue forecast." >> "$GITHUB_STEP_SUMMARY"

      - name: Log worker end (private, even if a test failed)
        if: always()
        env:
          ENNA_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$ENNA_JOB_STATUS" = "success" ]; then
            python -m growth.activity_log growth success growth_completed
          else
            python -m growth.activity_log growth failed growth_failed
          fi
