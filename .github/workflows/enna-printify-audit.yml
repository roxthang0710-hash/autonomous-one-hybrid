name: Enna - Printify API color audit (read-only)

on:
  push:
    branches:
      - enna/printify-api-no-tinyfish-20261120
    paths:
      - 'integrations/printify/**'
      - '.github/workflows/enna-printify-audit.yml'
  workflow_dispatch:
    inputs:
      printify_shop_id:
        description: "Exact shop ID if more than one connected Printify shop"
        required: false
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline safety tests
        run: python -m unittest discover -s integrations/printify -p 'test_*.py' -v
      - name: Printify read-only audit
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ inputs.printify_shop_id }}
        run: python integrations/printify/audit.py --github-summary
