name: Enna — Proactive Agent Desk Alerts
on:
  schedule:
    # Vietnam 07:23, 13:23, 19:23, 01:23
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enna-proactive-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test non-fabricating proactive rules
        run: python -m unittest discover -s tests -p 'test_enna_desk_monitor.py' -v
      - name: Build and store owner-only proactive notifications
        run: python -m growth.enna_desk_monitor
      - name: Safety summary
        if: always()
        run: |
          echo 'Enna Desk monitors only existing verified social metrics and operation codes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public posts, replies, paid actions or OAuth writes.' >> "$GITHUB_STEP_SUMMARY"
