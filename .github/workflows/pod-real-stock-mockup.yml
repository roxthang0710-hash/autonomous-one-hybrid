name: POD real-photo mockup builder
on:
  push:
    branches: [main]
    paths:
      - scripts/pod_real_stock_mockup.py
      - scripts/pod_v42_offline_preview.py
      - .github/workflows/pod-real-stock-mockup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing only
        run: pip install --quiet "Pillow>=11,<13" requests numpy
      - name: Fetch real stock photography and prepare mockup assets
        run: python scripts/pod_real_stock_mockup.py
      - name: Build self-contained V4.2 HTML preview
        run: python scripts/pod_v42_offline_preview.py
      - name: Render V4.2 HTML in real Chromium at desktop and mobile
        run: |
          pip install --quiet "playwright==1.56.0"
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          preview=Path("docs/pod/DOHAYDILAM_V4_2_OFFLINE_PREVIEW.html").resolve()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width,height,name in [(1440,900,"desktop"),(390,844,"mobile")]:
                  page=browser.new_page(viewport={"width":width,"height":height},device_scale_factor=1)
                  page.goto(preview.as_uri(),wait_until="load")
                  loaded=page.locator('img').evaluate_all("(els)=>els.map(x=>({ok:x.complete && x.naturalWidth>0,src:x.currentSrc.substring(0,23)}))")
                  assert all(x["ok"] for x in loaded),f"broken image {name}: {loaded}"
                  sw=page.evaluate("document.documentElement.scrollWidth")
                  assert sw<=width+1,f"horizontal overflow {name}: {sw}>{width}"
                  page.screenshot(path=f"docs/pod/v4_2_offline_{name}.png",full_page=True)
                  print(f"OK {name}: {len(loaded)} images, width {sw}, screenshot saved")
                  page.close()
              browser.close()
          PY
      - name: Commit resulting picture assets
        run: |
          git config user.name "Enna POD Design Bot"
          git config user.email "enna-design-bot@users.noreply.github.com"
          git add docs/pod/DOHAYDILAM_V4_2_OFFLINE_PREVIEW.html docs/pod/v4_2_offline_desktop.png docs/pod/v4_2_offline_mobile.png docs/pod/v4_real_stock_contact_sheet.jpg docs/pod/mug_artwork_inspection.jpg docs/pod/pexels_9031809_position_guide.jpg docs/pod/v4_mug_stock_mockup_portrait.jpg docs/pod/v4_mug_stock_mockup_office.jpg docs/pod/v4_mug_real_stock_mockups_comparison.jpg
          if ! git diff --cached --quiet; then
            git commit -m "assets(pod): real-photo review contact sheet"
            git push
          fi
