name: Enna - Printify write token safe preflight
on:
  push:
    branches:
      - enna/printify-colorway-staging-20261120
    paths:
      - 'integrations/printify/write_preflight.py'
      - '.github/workflows/enna-printify-write-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only authenticated preflight (NO POST/PUT)
        env:
          PRINTIFY_API_TOKEN_WRITE: ${{ secrets.PRINTIFY_API_TOKEN_WRITE }}
        run: python integrations/printify/write_preflight.py
