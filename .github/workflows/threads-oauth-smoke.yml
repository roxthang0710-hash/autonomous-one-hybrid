name: Autonomous One — OAuth Endpoint Smoke Test
on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'oauth:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm OAuth static UI files are present
        run: |
          test -s docs/oauth/index.html
          test -s docs/oauth/client.js
          test -s docs/oauth/style.css
          grep -q 'meta charset="utf-8"' docs/oauth/index.html
      - name: Verify new API only serves safe redirects and authenticated JSON
        shell: python
        run: |
          import urllib.request, urllib.error
          base="https://gjdvdohylvsauphhkutw.supabase.co/functions/v1/threads-oauth"
          page="https://roxthang0710-hash.github.io/autonomous-one-hybrid/oauth/"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, hdrs, newurl):
              return None
          opener=urllib.request.build_opener(NoRedirect())
          def call(url, method="GET", data=None, headers=None):
            req=urllib.request.Request(url,method=method,data=data,headers=headers or {})
            try:
              with opener.open(req,timeout=18) as r:
                return r.status,r.headers, r.read(16000)
            except urllib.error.HTTPError as e:
              return e.code,e.headers,e.read(16000)
          status,head,body=call(base)
          print("API landing status:",status,"location:",head.get("Location"))
          assert status==303 and head.get("Location")==page
          status,head,body=call(base+"/start",method="OPTIONS",headers={
              "Origin":"https://roxthang0710-hash.github.io",
              "Access-Control-Request-Method":"POST",
              "Access-Control-Request-Headers":"authorization,apikey,content-type"
          })
          print("Authorized CORS preflight:",status,head.get("Access-Control-Allow-Origin"))
          assert status==204
          assert head.get("Access-Control-Allow-Origin")=="https://roxthang0710-hash.github.io"
          status,head,body=call(base+"/start",method="OPTIONS",headers={
              "Origin":"https://untrusted.example",
              "Access-Control-Request-Method":"POST"
          })
          print("Other-origin CORS preflight:",status)
          assert status==403
          status,head,body=call(base+"/start",method="POST",data=b'{}',headers={
              "Origin":"https://roxthang0710-hash.github.io",
              "Content-Type":"application/json"
          })
          print("Unauthenticated OAuth start:",status,head.get("Content-Type"))
          assert status==401 and "application/json" in head.get("Content-Type","")
          status,head,body=call(base+"/callback?code=invalid&state=invalid")
          print("Invalid callback:",status)
          assert status==303 and head.get("Location")==page+"?status=failed"
          print("PASS: Edge OAuth API is JSON-only, CORS restricted and safe to redirect.")
      - name: Check GitHub Pages publishing status without treating 404 as a successful UI
        shell: python
        run: |
          import urllib.request, urllib.error
          url="https://roxthang0710-hash.github.io/autonomous-one-hybrid/oauth/"
          try:
            with urllib.request.urlopen(url,timeout=18) as response:
              body=response.read(10000)
              status=response.status
              ct=response.headers.get("Content-Type","")
          except urllib.error.HTTPError as error:
            status=error.code;ct=error.headers.get("Content-Type","");body=b""
          print("GitHub Pages:",status,"MIME:",ct)
          if status==200 and "text/html" in ct and b"@dohay_dilam" in body:
            print("LIVE: static HTML portal is accessible to the owner.")
          elif status==404:
            print("NOT YET LIVE: owner must enable Settings > Pages > deploy from main /docs.")
          else:
            print("NEEDS REVIEW: GitHub Pages unexpected status/content.")

      - name: Diagnose public Supabase login providers (no secrets)
        shell: python
        run: |
          import json,urllib.request,urllib.error
          url="https://gjdvdohylvsauphhkutw.supabase.co/auth/v1/settings"
          try:
            req=urllib.request.Request(url,headers={"apikey":"sb_publishable_sJxwXdpQPn4FrrGZPusJmA_Xy5TI0-H"})
            with urllib.request.urlopen(req,timeout=15) as r:
              doc=json.load(r)
              print("Auth settings response:",r.status)
              print("Email login enabled:",doc.get("external",{}).get("email"))
              print("Google provider enabled:",doc.get("external",{}).get("google"))
              print("Other external providers have been omitted.")
          except urllib.error.HTTPError as e:
            print("Auth settings HTTP",e.code)
