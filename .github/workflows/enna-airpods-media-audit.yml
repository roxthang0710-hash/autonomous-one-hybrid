name: Enna - Printify AirPods missing media audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report Printify official media URLs for only 7 missing Shopify images
        env:
          PRINTIFY_API_TOKEN_WRITE: ${{ secrets.PRINTIFY_API_TOKEN_WRITE }}
        run: python integrations/printify/missing_airpods_media.py
