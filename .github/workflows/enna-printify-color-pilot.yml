name: Enna - Printify color draft pilot

on:
  push:
    branches: [enna/printify-write-draft-colors-20261121]
    paths:
      - 'integrations/printify/draft_colorways.py'
      - '.github/workflows/enna-printify-color-pilot.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_draft:
        description: "Create one Printify-only unpublished Cream draft (never publish to Shopify)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify token, exact source, and color payload
        env:
          PRINTIFY_API_TOKEN_WRITE: ${{ secrets.PRINTIFY_API_TOKEN_WRITE }}
        run: python integrations/printify/draft_colorways.py
      - name: Create one QA-only draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_draft == true }}
        env:
          PRINTIFY_API_TOKEN_WRITE: ${{ secrets.PRINTIFY_API_TOKEN_WRITE }}
        run: python integrations/printify/draft_colorways.py --color cream --create-draft
