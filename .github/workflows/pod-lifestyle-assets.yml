name: POD generate fast lifestyle WebP assets
on:
  push:
    branches: [main]
    paths:
      - 'docs/pod/mockups/originals/**'
      - 'scripts/pod_optimize_lifestyle_mockups.py'
      - '.github/workflows/pod-lifestyle-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pod-lifestyle-asset-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --quiet "Pillow>=11,<13"
      - name: Create WebP images and integrity manifest
        run: python scripts/pod_optimize_lifestyle_mockups.py
      - name: Save assets to main
        run: |
          git config user.name "Enna POD Design Bot"
          git config user.email "enna-design-bot@users.noreply.github.com"
          git add docs/pod/mockups/web
          if ! git diff --cached --quiet; then
            git commit -m "assets(pod): optimized lifestyle mockups for public storefront"
            git push origin HEAD:main
          fi
